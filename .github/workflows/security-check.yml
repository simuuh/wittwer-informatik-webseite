name: Security Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Jeden Montag 07:00 UTC — auch ohne Push
    - cron: '0 7 * * 1'

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8 installieren
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: config.php für Tests erstellen
        run: |
          cat > config.php << 'CONF'
          <?php
          return [
            'firma' => [
              'name'    => 'Wittwer Informatik',
              'inhaber' => 'Simon Wittwer',
              'strasse' => '',
              'plz'     => '',
              'ort'     => '',
              'kanton'  => 'Kanton Bern',
              'land'    => 'Schweiz',
              'uid'     => 'CHE-348.095.495',
              'mail'    => 'hallo@wittwer-informatik.ch',
              'website' => 'https://wittwer-informatik.ch',
            ],
            'seo' => [
              'title'       => 'Wittwer Informatik',
              'description' => 'Test',
              'url'         => 'https://wittwer-informatik.ch',
            ],
          ];
          CONF

      - name: Lokalen Server starten
        run: php -S localhost:8080 &

      - name: Warten bis Server bereit
        run: sleep 2

      # -------------------------------------------------------
      # A03 INJECTION — Path Traversal
      # -------------------------------------------------------
      - name: "A03 | Path Traversal: page-Parameter mit ../"
        run: |
          BODY=$(curl -s "http://localhost:8080/?page=../../etc/passwd")
          echo "$BODY" | grep -qi "root:\|nobody:\|daemon:" && exit 1 || echo "OK"

      - name: "A03 | Path Traversal: page-Parameter mit config"
        run: |
          BODY=$(curl -s "http://localhost:8080/?page=config")
          # config.php darf nicht gerendert werden, landet auf Home.
          # Marker: Quelltext der config.php, der nie im Seiten-Output steht.
          echo "$BODY" | grep -q "return \[\|'firma'" && exit 1 || echo "OK"

      # -------------------------------------------------------
      # A03 INJECTION — XSS (Reflected)
      # -------------------------------------------------------
      - name: "A03 XSS | Script-Tag im page-Parameter"
        run: |
          BODY=$(curl -s "http://localhost:8080/?page=<script>alert(1)</script>")
          echo "$BODY" | grep -q "<script>alert(1)</script>" && exit 1 || echo "OK"

      # -------------------------------------------------------
      # A05 SECURITY MISCONFIGURATION — PHP-Fehlerausgabe
      # -------------------------------------------------------
      - name: "A05 | Keine PHP-Fehler oder Warnings im Output"
        run: |
          BODY=$(curl -s http://localhost:8080/)
          echo "$BODY" | grep -qiE "Fatal error|Parse error|Warning:|Notice:|Deprecated:" && exit 1 || echo "OK"

      - name: "A05 | Kein phpinfo() erreichbar"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/phpinfo.php)
          [ "$STATUS" = "404" ] || [ "$STATUS" = "403" ] || echo "Warnung: phpinfo.php scheint erreichbar zu sein"

      # -------------------------------------------------------
      # A02 CRYPTOGRAPHIC FAILURES — Sensitive Files
      # -------------------------------------------------------
      - name: "A02 | config.php nicht direkt abrufbar"
        run: |
          BODY=$(curl -s http://localhost:8080/config.php)
          # config.php gibt ein PHP-Array zurück, kein HTML
          # Im Output darf kein Quelltext stehen
          echo "$BODY" | grep -q "return \[\|'firma'" && exit 1 || echo "OK"

      - name: "A02 | projects.php nicht direkt abrufbar"
        run: |
          BODY=$(curl -s http://localhost:8080/projects.php)
          echo "$BODY" | grep -qi "beschreibung\|features\|stack" && exit 1 || echo "OK"

      # -------------------------------------------------------
      # STATIC ANALYSIS — grep auf bekannte Schwachstellenmuster
      # -------------------------------------------------------
      - name: "Static | Kein eval() im Code"
        run: |
          grep -rn "eval(" --include="*.php" . && exit 1 || echo "OK"

      - name: "Static | Kein system() oder exec() im Code"
        run: |
          grep -rn "system(\|exec(\|shell_exec(\|passthru(" --include="*.php" . && exit 1 || echo "OK"

      - name: "Static | Kein var_dump() oder print_r() im Produktivcode"
        run: |
          grep -rn "var_dump(\|print_r(" --include="*.php" . && exit 1 || echo "OK"

      - name: "Static | Kein hardcodierter Secret-Key"
        run: |
          grep -rn "secret_key.*=.*['\"][a-zA-Z0-9]\{10,\}" --include="*.php" . && exit 1 || echo "OK"

      - name: "Static | htmlspecialchars() wird für Ausgaben verwendet"
        run: |
          # Prüft ob htmlspecialchars in index.php vorhanden ist
          grep -q "htmlspecialchars" index.php || exit 1
          echo "OK"
